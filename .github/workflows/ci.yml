name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Ruff and Pytest
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://auto_parking:change-me@localhost:5432/auto_parking_test
      AUDIT_DATABASE_URL: postgresql+asyncpg://auto_parking:change-me@localhost:5432/auto_parking_test
      JWT_SECRET_KEY: test-secret
      RUN_INTEGRATION: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://auto_parking:change-me@localhost:5432/auto_parking_test
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: auto_parking_test
          POSTGRES_USER: auto_parking
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auto_parking -d auto_parking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Ruff
        run: poetry run ruff check .

      - name: Pytest
        run: poetry run pytest tests

  images:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "namespace=${owner}/auto-parking" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.namespace }}/app:${{ steps.images.outputs.tag }}
            ghcr.io/${{ steps.images.outputs.namespace }}/app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build notification-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: notification_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.namespace }}/notification-service:${{ steps.images.outputs.tag }}
            ghcr.io/${{ steps.images.outputs.namespace }}/notification-service:latest
          cache-from: type=gha,scope=notification-service
          cache-to: type=gha,mode=max,scope=notification-service

      - name: Build audit-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: audit_service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.namespace }}/audit-service:${{ steps.images.outputs.tag }}
            ghcr.io/${{ steps.images.outputs.namespace }}/audit-service:latest
          cache-from: type=gha,scope=audit-service
          cache-to: type=gha,mode=max,scope=audit-service

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.images.outputs.namespace }}/frontend:${{ steps.images.outputs.tag }}
            ghcr.io/${{ steps.images.outputs.namespace }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

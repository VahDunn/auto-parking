[project]
name = "auto-parking"
version = "0.1.0"
description = ""
authors = [
    { name = "Vladislav Morozov", email = "landaren11@gmail.com" }
]
requires-python = ">=3.12, <4"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "sqladmin (>=0.22.0,<0.23.0)",
    "alembic (>=1.18.3,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.3.1,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "wtforms (>=3.1,<3.2)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "asgi-lifespan (>=2.1.0,<3.0.0)",
    "typer (>=0.24.1,<0.25.0)",
    "faker (>=40.8.0,<41.0.0)",
    "geoalchemy2 (>=0.18.4,<0.19.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "reportlab (>=4.5.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "bcrypt (>=4.0.1,<4.1.0)",
    "redis (>=5.2.1,<6.0.0)",
    "prometheus-client (>=0.21.1,<0.22.0)",
    "reactivex (>=4.1.0,<5.0.0)",
    "websockets (>=16.0,<17.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "opentelemetry-sdk (>=1.41.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.41.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.62b0,<0.63)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.62b0,<0.63)",
    "opentelemetry-instrumentation-httpx (>=0.62b0,<0.63)",
    "opentelemetry-instrumentation-redis (>=0.62b0,<0.63)",
    "opentelemetry-instrumentation-aiokafka (>=0.62b0,<0.63)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=1.19.1,<2.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "locust (>=2.44.4,<3.0.0)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external infrastructure such as Postgres/PostGIS",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.pyright]
typeCheckingMode = 'standard'
reportMissingImports = true
reportMissingTypeArgument = false
exclude = [
    '.*',
    '.venv',
    'venv',
    'build',
    'dist',
    '**/node_modules',
    '**/__pycache__',
    'auto_parking/infrastructure/db/admin.py'
]
ignore = [
    'tests/**',
]

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  audit-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB:-audit_db}
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-audit_user}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:-audit_password}
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/app:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command: >
      python -m event_bus.init_topics

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/app:${IMAGE_TAG:-latest}
    profiles:
      - migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      alembic upgrade head

  auto-parking:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV:-prod}
      DEBUG: ${DEBUG:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      GPS_CONSUMER_ENABLED: ${GPS_CONSUMER_ENABLED:-true}
      ENTITY_CACHE_TTL_SECONDS: ${ENTITY_CACHE_TTL_SECONDS:-300}
      VEHICLE_MODEL_CACHE_TTL_SECONDS: ${VEHICLE_MODEL_CACHE_TTL_SECONDS:-3600}
      VEHICLE_TRACK_CACHE_TTL_SECONDS: ${VEHICLE_TRACK_CACHE_TTL_SECONDS:-300}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
      PERFORMANCE_LOG_PATH: /app/logs/performance.jsonl
      APP_ACCESS_LOG_PATH: /app/logs/app-access.log
    volumes:
      - ./logs:/app/logs
    command: >
      uvicorn auto_parking.main:app
      --host 0.0.0.0
      --port 8000
      --workers ${WEB_CONCURRENCY:-5}
    expose:
      - "8000"

  telegram-bot:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/app:${IMAGE_TAG:-latest}
    profiles:
      - bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      auto-parking:
        condition: service_started
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV:-prod}
      DEBUG: ${DEBUG:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_BASE_URL: http://auto-parking:8000/api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BOT_SUMMARY_CACHE_TTL_SECONDS: ${BOT_SUMMARY_CACHE_TTL_SECONDS:-300}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
      PERFORMANCE_LOG_PATH: /app/logs/performance-bot.jsonl
    volumes:
      - ./logs:/app/logs
    command: >
      python -m auto_parking.bot.main

  notification-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/notification-service:${IMAGE_TAG:-latest}
    profiles:
      - notifications
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DEBUG: ${DEBUG:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
    command: >
      python -m notification_service.main

  audit-service:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/audit-service:${IMAGE_TAG:-latest}
    profiles:
      - audit
    restart: unless-stopped
    depends_on:
      audit-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      DEBUG: ${DEBUG:-false}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_POSTGRES_USER:-audit_user}:${AUDIT_POSTGRES_PASSWORD:-audit_password}@audit-db:5432/${AUDIT_POSTGRES_DB:-audit_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_AUDIT_SOURCE_CONSUMER_GROUP: ${KAFKA_AUDIT_SOURCE_CONSUMER_GROUP:-auto-parking-audit-service}
    command: >
      python -m audit_service.main

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - auto-parking
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - auto-parking
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
  audit_db_data:
  redis_data:
  kafka_data:

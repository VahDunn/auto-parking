<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Auto Parking</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="card shadow-sm mb-4" id="loginCard">
                <div class="card-body p-4">
                    <h2 class="card-title mb-3 text-center">Вход</h2>
                    <div id="messageBox"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="username" required/>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="password" required/>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Войти
                        </button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm d-none" id="enterpriseCard">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="card-title mb-0">Предприятия</h2>
                        <button class="btn btn-outline-secondary btn-sm" id="reloadBtn">
                            Обновить
                        </button>
                    </div>

                    <div id="enterpriseMessage"></div>
                    <ul class="list-group" id="enterpriseList"></ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8001/api";

    const loginForm = document.getElementById("loginForm");
    const loginCard = document.getElementById("loginCard");
    const enterpriseCard = document.getElementById("enterpriseCard");
    const messageBox = document.getElementById("messageBox");
    const enterpriseMessage = document.getElementById("enterpriseMessage");
    const enterpriseList = document.getElementById("enterpriseList");
    const reloadBtn = document.getElementById("reloadBtn");

    function showMessage(container, type, text) {
        container.innerHTML = `
        <div class="alert alert-${type}" role="alert">
          ${text}
        </div>
      `;
    }

    function clearMessage(container) {
        container.innerHTML = "";
    }

    function renderEnterprises(items) {
        enterpriseList.innerHTML = "";

        if (!items || items.length === 0) {
            enterpriseList.innerHTML = `
          <li class="list-group-item text-muted">
            Нет доступных предприятий
          </li>
        `;
            return;
        }

        items.forEach((enterprise) => {
            const li = document.createElement("li");
            li.className = "list-group-item";

            li.innerHTML = `
          <div class="fw-semibold">${enterprise.name ?? "Без названия"}</div>
          <div class="text-muted small">ID: ${enterprise.id}</div>
        `;

            enterpriseList.appendChild(li);
        });
    }

    async function loadEnterprises() {
        clearMessage(enterpriseMessage);
        enterpriseList.innerHTML = `<li class="list-group-item">Загрузка...</li>`;

        try {
            const response = await fetch(`${API_BASE}/enterprises`, {
                method: "GET",
                credentials: "include"
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || "Не удалось получить список предприятий");
            }

            const enterprises = await response.json();
            renderEnterprises(enterprises);
        } catch (error) {
            enterpriseList.innerHTML = "";
            showMessage(enterpriseMessage, "danger", error.message);
        }
    }

    loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearMessage(messageBox);

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({username, password})
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.detail || "Ошибка авторизации");
            }

            showMessage(messageBox, "success", "Успешный вход");

            loginCard.classList.add("d-none");
            enterpriseCard.classList.remove("d-none");

            await loadEnterprises();
        } catch (error) {
            showMessage(messageBox, "danger", error.message);
        }
    });

    reloadBtn.addEventListener("click", loadEnterprises);
</script>
</body>
</html>

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: auto_parking_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auto_parking_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  audit-db:
    image: postgres:16-alpine
    container_name: auto_parking_audit_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDIT_POSTGRES_DB:-audit_db}
      POSTGRES_USER: ${AUDIT_POSTGRES_USER:-audit_user}
      POSTGRES_PASSWORD: ${AUDIT_POSTGRES_PASSWORD:-audit_password}
    volumes:
      - audit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: auto_parking_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    build: .
    container_name: auto_parking_kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    command: >
      python -m event_bus.init_topics

  migrate:
    build: .
    container_name: auto_parking_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEBUG: "false"
    command: >
      alembic upgrade head

  auto-parking:
    build: .
    container_name: auto_parking_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      GPS_CONSUMER_ENABLED: ${GPS_CONSUMER_ENABLED:-true}
      ENTITY_CACHE_TTL_SECONDS: ${ENTITY_CACHE_TTL_SECONDS:-300}
      VEHICLE_MODEL_CACHE_TTL_SECONDS: ${VEHICLE_MODEL_CACHE_TTL_SECONDS:-3600}
      VEHICLE_TRACK_CACHE_TTL_SECONDS: ${VEHICLE_TRACK_CACHE_TTL_SECONDS:-300}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-auto-parking-api}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1.0}
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: ${OTEL_PYTHON_FASTAPI_EXCLUDED_URLS:-.*/metrics$,.*/api/health$}
      PERFORMANCE_LOG_PATH: /app/logs/performance.jsonl
      APP_ACCESS_LOG_PATH: /app/logs/app-access.log
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c 'rm -rf /tmp/prometheus_multiproc
      && mkdir -p /tmp/prometheus_multiproc
      && uvicorn auto_parking.main:app
      --host 0.0.0.0
      --port 8000
      --workers 5'
    expose:
      - "8000"

  telegram-bot:
    build: .
    container_name: auto_parking_telegram_bot
    profiles:
      - bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auto-parking:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_BASE_URL: http://auto-parking:8000/api
      REDIS_URL: ${REDIS_URL}
      BOT_SUMMARY_CACHE_TTL_SECONDS: ${BOT_SUMMARY_CACHE_TTL_SECONDS:-300}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
      PERFORMANCE_LOG_PATH: /app/logs/performance-bot.jsonl
    volumes:
      - ./logs:/app/logs
    command: >
      python -m auto_parking.bot.main

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: auto_parking_notification_service
    profiles:
      - notifications
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
    command: >
      python -m notification_service.main

  audit-service:
    build:
      context: .
      dockerfile: audit_service/Dockerfile
    container_name: auto_parking_audit_service
    profiles:
      - audit
    restart: unless-stopped
    depends_on:
      audit-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG}
      AUDIT_DATABASE_URL: postgresql+asyncpg://${AUDIT_POSTGRES_USER:-audit_user}:${AUDIT_POSTGRES_PASSWORD:-audit_password}@audit-db:5432/${AUDIT_POSTGRES_DB:-audit_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_AUDIT_SOURCE_CONSUMER_GROUP: ${KAFKA_AUDIT_SOURCE_CONSUMER_GROUP:-auto-parking-audit-service}
    command: >
      python -m audit_service.main

  frontend:
    build: ./frontend
    container_name: auto_parking_frontend
    restart: unless-stopped
    depends_on:
      - auto-parking
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: auto_parking_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - auto-parking
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: auto_parking_blackbox_exporter
    restart: unless-stopped
    depends_on:
      - nginx
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    expose:
      - "9115"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: auto_parking_prometheus
    restart: unless-stopped
    depends_on:
      - auto-parking
      - blackbox-exporter
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=http://localhost:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: auto_parking_alertmanager
    profiles:
      - alerts
    restart: unless-stopped
    depends_on:
      - mailpit
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    secrets:
      - alert_telegram_bot_token
      - alert_telegram_chat_id

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: auto_parking_mailpit
    profiles:
      - alerts
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"

  tempo:
    image: grafana/tempo:3.0.2
    container_name: auto_parking_tempo
    restart: unless-stopped
    command:
      - --config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test:
        - CMD
        - /tempo
        - --health
        - --health.url=http://localhost:3200/ready
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: auto_parking_otel_collector
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_healthy
    command:
      - --config=/etc/otelcol-contrib/config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    expose:
      - "13133"
      - "8888"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    container_name: auto_parking_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/auto-parking-api.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  seed-vehicles:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "false"
      LOG_LEVEL: WARNING
    command: >
      python -m auto_parking.minor_utilities.vehicle_generator
      --count 120
      --enterprise-id 2
      --enterprise-id 3
      --driver-ratio 2
      --seed 42

  seed-tracks:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "false"
      LOG_LEVEL: WARNING
    command: >
      python -m auto_parking.minor_utilities.seed_demo_tracks
      --enterprise-id 2
      --trips-per-vehicle 30
      --points-per-trip 100
      --date-from 2024-01-01
      --date-to 2026-01-01
      --clear-before
      --seed 42

volumes:
  db_data:
    external: true
    name: auto-parking_db_data
  redis_data:
  audit_db_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  alertmanager_data:

secrets:
  alert_telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  alert_telegram_chat_id:
    environment: ALERT_TELEGRAM_CHAT_ID

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: auto_parking_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auto_parking_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: auto_parking_kafka
    restart: unless-stopped
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  auto-parking:
    build: .
    container_name: auto_parking_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      REDIS_URL: ${REDIS_URL}
      EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      ENTITY_CACHE_TTL_SECONDS: ${ENTITY_CACHE_TTL_SECONDS:-300}
      VEHICLE_MODEL_CACHE_TTL_SECONDS: ${VEHICLE_MODEL_CACHE_TTL_SECONDS:-3600}
      VEHICLE_TRACK_CACHE_TTL_SECONDS: ${VEHICLE_TRACK_CACHE_TTL_SECONDS:-300}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
      PERFORMANCE_LOG_PATH: /app/logs/performance.jsonl
      APP_ACCESS_LOG_PATH: /app/logs/app-access.log
    volumes:
      - ./logs:/app/logs
    command: >
      uvicorn auto_parking.main:app
      --host 0.0.0.0
      --port 8000
      --workers 5
    expose:
      - "8000"

  telegram-bot:
    build: .
    container_name: auto_parking_telegram_bot
    profiles:
      - bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      auto-parking:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_API_BASE_URL: http://auto-parking:8000/api
      REDIS_URL: ${REDIS_URL}
      BOT_SUMMARY_CACHE_TTL_SECONDS: ${BOT_SUMMARY_CACHE_TTL_SECONDS}
      PERFORMANCE_LOG_PATH: /app/logs/performance-bot.jsonl
    volumes:
      - ./logs:/app/logs
    command: >
      python -m auto_parking.bot.main

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    container_name: auto_parking_notification_service
    profiles:
      - notifications
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      REDIS_URL: ${REDIS_URL}
      EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_NOTIFICATION_CONSUMER_GROUP: ${KAFKA_NOTIFICATION_CONSUMER_GROUP:-auto-parking-notification-service}
      BOT_LOGIN_REGISTRY_TTL_SECONDS: ${BOT_LOGIN_REGISTRY_TTL_SECONDS:-604800}
    command: >
      python -m notification_service.main

  frontend:
    build: ./frontend
    container_name: auto_parking_frontend
    restart: unless-stopped
    depends_on:
      - auto-parking
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: auto_parking_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - auto-parking
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: auto_parking_prometheus
    restart: unless-stopped
    depends_on:
      - auto-parking
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: auto_parking_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/auto-parking-api.json
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  seed-vehicles:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "false"
      LOG_LEVEL: WARNING
    command: >
      python -m auto_parking.minor_utilities.vehicle_generator
      --count 120
      --enterprise-id 2
      --enterprise-id 3
      --driver-ratio 2
      --seed 42

  seed-tracks:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "false"
      LOG_LEVEL: WARNING
    command: >
      python -m auto_parking.minor_utilities.seed_demo_tracks
      --enterprise-id 2
      --trips-per-vehicle 30
      --points-per-trip 100
      --date-from 2024-01-01
      --date-to 2026-01-01
      --clear-before
      --seed 42

volumes:
  db_data:
    external: true
    name: auto-parking_db_data
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

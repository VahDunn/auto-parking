services:
  db:
    image: postgis/postgis:16-3.4
    container_name: auto_parking_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auto-parking:
    build: .
    container_name: auto_parking_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      TEST_ADMIN_LOGIN: ${TEST_ADMIN_LOGIN}
      TEST_ADMIN_PASS: ${TEST_ADMIN_PASS}
    command: >
      gunicorn auto_parking.main:app
      --worker-class uvicorn_worker.UvicornWorker
      --workers 4
      --bind 0.0.0.0:8000
      --timeout 120
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: auto_parking_frontend
    restart: unless-stopped
    depends_on:
      - auto-parking
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: auto_parking_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - auto-parking
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  seed-vehicles:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      python -m auto_parking.minor_utilities.vehicle_generator
      --count 120
      --enterprise-id 2
      --enterprise-id 3
      --driver-ratio 2
      --seed 42

  seed-tracks:
    build: .
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      python -m auto_parking.minor_utilities.seed_demo_tracks
      --enterprise-id 2
      --vehicles-count 120
      --total-trips 2000
      --points-per-trip 100
      --date-from 2024-01-01
      --date-to 2026-01-01
      --clear-before
      --seed 42

volumes:
  db_data:
    external: true
    name: auto-parking_db_data
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: auto-parking-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - auto-parking:8000

  - job_name: auto-parking-health
    scrape_timeout: 4s
    metrics_path: /probe
    params:
      module:
        - auto_parking_health
    static_configs:
      - targets:
          - http://nginx/api/health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets:
          - tempo:3200

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
